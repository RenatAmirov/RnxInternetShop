name: rnx-internet-shop

services:
  shop:
    build: .
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: Host=postgres;Database=shop;Username=shop;Password=shop-local
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: amqp://shop:shop-local@rabbitmq:5672/
      Mail__Host: mailpit
      Mail__Port: 1025
      Sms__DemoInbox: "true"
    ports:
      - "127.0.0.1:5088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - data-protection:/home/app/.aspnet/DataProtection-Keys

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop-local
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U shop -d shop']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: shop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop-local
    ports:
      - "127.0.0.1:25672:5672"
      - "127.0.0.1:25673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    volumes:
      - mail-data:/data

volumes:
  postgres-data:
  rabbitmq-data:
  mail-data:
  data-protection:
